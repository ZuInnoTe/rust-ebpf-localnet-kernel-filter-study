[package]
name = "uprobe-libcall-filter-app"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
aya = { version = "0.14.0", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
bytes = {version = "1"}
clap = { version = "4.1.1", features = ["derive"] }
env_logger = "0.11"
uprobe-libcall-filter-common = { path = "../uprobe-libcall-filter-common", features=["user"] }
log = {version="0.4"}
serde = {version="1.0.229", features = ["derive"] }
serde_yaml = {version = "0.9.16"}
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }


[dev-dependencies]
rand = {version="0.10.2"}

[[bin]]
name = "uprobe-libcall-filter-app"
path = "src/main.rs"