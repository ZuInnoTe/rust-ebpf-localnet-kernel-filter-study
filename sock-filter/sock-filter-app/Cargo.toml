[package]
name = "sock-filter-app"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
anyhow = "1.0.104"
aya = { version = "0.14.0", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
bytes = {version = "1"}
clap = { version = "4.6", features = ["derive"] }
libc = {version="0.2"}
sock-filter-common = { path = "../sock-filter-common", features=["user"] }
log = {version="0.4"}
serde = {version="1.0.229", features = ["derive"] }
serde_yaml = {version = "0.9.16"}
tokio = { version = "1.53",  features = ["macros", "rt", "rt-multi-thread", "net", "signal","sync"]  }
uuid = {version="1.24.0"}
env_logger = "0.11"

[dev-dependencies]
rand = {version="0.10.2"}

[[bin]]
name = "sock-filter-app"
path = "src/main.rs"